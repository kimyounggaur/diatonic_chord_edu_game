<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코드 크래프터 · 모바일 검수</title><style>body{margin:0;background:#e7eae1;font:14px system-ui;color:#324f40}header{padding:18px;display:flex;gap:18px;align-items:center;justify-content:center}button{padding:12px 18px;border:1px solid #bbcbb3;border-radius:8px;background:#fffef5;color:#355a42;cursor:pointer}iframe{display:block;border:1px solid #b5c3ac;border-radius:18px;margin:0 auto 25px;background:#f7f8f4;box-shadow:0 15px 40px #213c2725}span{font-size:12px}</style></head><body><header><strong>모바일 화면 검수</strong><button onclick="resize(390,844)">390 × 844</button><button onclick="resize(320,568)">320 × 568</button><span id="size">390 × 844</span></header><iframe title="모바일 게임 미리보기" src="/" width="390" height="844"></iframe><script>function resize(w,h){const f=document.querySelector('iframe');f.width=w;f.height=h;document.getElementById('size').textContent=w+' × '+h}</script></body></html>
